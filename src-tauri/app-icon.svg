  <!-- calligraphy: a tall «القرآن» over «الكريم», with thuluth-style ornamental marks in the gaps -->
  <g filter="url(#emboss)" fill="url(#ink)" font-family="Amiri" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="512" y="522" font-size="286" transform="translate(512 522) scale(1 1.16) translate(-512 -522)">القُرْآنُ</text>
    <text x="512" y="742" font-size="196" transform="translate(512 742) scale(1 1.12) translate(-512 -742)">الكَرِيمُ</text>
  </g>
  <g id="marks" filter="url(#emboss)" fill="url(#ink)" stroke="url(#ink)" stroke-linecap="round"></g>
</svg>
