<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#4a2410"/>
      <stop offset=".6" stop-color="#241006"/>
      <stop offset="1" stop-color="#130803"/>
    </radialGradient>
    <radialGradient id="disk" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#8a4716"/>
      <stop offset=".45" stop-color="#4b220b"/>
      <stop offset="1" stop-color="#1c0b03"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset=".22" stop-color="#f1c862"/>
      <stop offset=".5" stop-color="#9a6318"/>
      <stop offset=".75" stop-color="#f3cf78"/>
      <stop offset="1" stop-color="#b47a22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset=".45" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#c48a2c"/>
    </linearGradient>
    <linearGradient id="tealInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4fff8"/>
      <stop offset=".45" stop-color="#5fd6c6"/>
      <stop offset="1" stop-color="#1f8f86"/>
    </linearGradient>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="inside"><circle cx="512" cy="512" r="378"/></clipPath>
  </defs>

  <rect x="20" y="20" width="984" height="984" rx="200" fill="url(#bg)"/>

  <!-- medallion: bevelled gold ring with a beaded band -->
  <circle cx="512" cy="512" r="440" fill="url(#ring)" filter="url(#emboss)"/>
  <circle cx="512" cy="512" r="418" fill="#2a1206"/>
  <g id="beads" fill="url(#ring)"></g>
  <circle cx="512" cy="512" r="392" fill="url(#ring)"/>
  <circle cx="512" cy="512" r="380" fill="url(#disk)"/>

  <!-- soft rays of light behind the calligraphy -->
  <g clip-path="url(#inside)" opacity=".5" id="rays"></g>
  <circle cx="512" cy="500" r="150" fill="#f3b354" opacity=".35" filter="url(#glow)"/>

  <g id="marks" filter="url(#emboss)" fill="url(#tealInk)" stroke="url(#tealInk)" stroke-linecap="round"></g>
</svg>
