<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<script>
// App icon v3: the original «القرآن الكريم» calligraphy (callig.png mask) in a round gold
// rosette medallion — like the ayah markers of the Shami mushaf — on a lapis-blue tile.
const q = new URLSearchParams(location.search);
const S = +(q.get('s') || 1024);
const SMALL = q.get('small') === '1';
const MASK = q.get('mask') || 'callig.png';
const C = 512, f = n => n.toFixed(2);

// scalloped rosette outline: n semicircular petals around radius r0
function rosette(r0, n) {
  const pts = [...Array(n)].map((_, i) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [C + r0*Math.cos(a), C + r0*Math.sin(a)]; });
  const br = r0 * Math.sin(Math.PI/n);
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 1; i <= n; i++) { const p = pts[i % n]; d += ` A${f(br)},${f(br)} 0 0 1 ${f(p[0])},${f(p[1])}`; }
  return d + 'Z';
}

// soft sunburst on the tile
let rays = '';
for (let i = 0; i < 40; i++) {
  const a = i * Math.PI/20, w = Math.PI/80, L = 760;
  rays += `<polygon points="${C},${C} ${f(C+L*Math.cos(a-w))},${f(C+L*Math.sin(a-w))} ${f(C+L*Math.cos(a+w))},${f(C+L*Math.sin(a+w))}"/>`;
}

const R0 = 398, N = 40; const OUTER = 392; // smooth gold rim (no scallops)          // rosette
const BAND = 374;                  // dark band inside rosette
const RING = 334;                  // gold ring around the calligraphy
const calR = SMALL ? 352 : 322, sc = calR / 326;

let beads = '';
if (!SMALL) for (let i = 0; i < 48; i++) {
  const a = -Math.PI/2 + i*Math.PI/24, d = 354, r = i % 2 ? 4.5 : 7.5;
  beads += `<circle cx="${f(C+d*Math.cos(a))}" cy="${f(C+d*Math.sin(a))}" r="${r}"/>`;
}

document.body.innerHTML = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="${S}" height="${S}">
  <defs>
    <radialGradient id="tile" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#3a72dc"/><stop offset=".5" stop-color="#18439f"/><stop offset="1" stop-color="#0a1c4e"/>
    </radialGradient>
    <radialGradient id="disk" cx="50%" cy="44%" r="58%">
      <stop offset="0" stop-color="#2a5fc8"/><stop offset=".6" stop-color="#11307c"/><stop offset="1" stop-color="#081a48"/>
    </radialGradient>
    <radialGradient id="band" cx="50%" cy="50%" r="50%">
      <stop offset=".85" stop-color="#0b2260"/><stop offset="1" stop-color="#06143a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/><stop offset=".25" stop-color="#f3cf6e"/><stop offset=".52" stop-color="#b9801f"/>
      <stop offset=".78" stop-color="#f6d680"/><stop offset="1" stop-color="#c08a26"/>
    </linearGradient>
    <linearGradient id="goldInk" gradientUnits="userSpaceOnUse" x1="0" y1="${C-calR}" x2="0" y2="${C+calR}">
      <stop offset="0" stop-color="#fffce8"/><stop offset=".45" stop-color="#fbe08e"/><stop offset="1" stop-color="#e2a83c"/>
    </linearGradient>
    <radialGradient id="bevel" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="${OUTER}">
      <stop offset=".955" stop-color="#5a3608" stop-opacity=".45"/><stop offset=".975" stop-color="#5a3608" stop-opacity="0"/>
      <stop offset=".985" stop-color="#fff3c4" stop-opacity="0"/><stop offset="1" stop-color="#fff3c4" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="shT" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="tileClip"><rect x="28" y="28" width="968" height="968" rx="214"/></clipPath>
    <clipPath id="diskClip"><circle cx="${C}" cy="${C}" r="${RING - 4}"/></clipPath>
    <mask id="callig" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <image href="${MASK}" width="1024" height="1024" preserveAspectRatio="none"
             transform="translate(${C} ${C}) scale(${sc}) translate(-513 -511.5)"/>
    </mask>
  </defs>

  <rect x="28" y="28" width="968" height="968" rx="214" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    ${SMALL ? '' : `<g fill="#bcd3ff" opacity=".07">${rays}</g>`}
    <rect x="28" y="28" width="968" height="968" fill="url(#sheen)"/>
  </g>
  <rect x="${SMALL?46:48}" y="${SMALL?46:48}" width="${SMALL?932:928}" height="${SMALL?932:928}" rx="${SMALL?198:196}"
        fill="none" stroke="url(#gold)" stroke-width="${SMALL?34:12}"/>

  ${SMALL ? `
  <circle cx="${C}" cy="${C}" r="410" fill="url(#gold)" filter="url(#sh)"/>
  <circle cx="${C}" cy="${C}" r="370" fill="url(#disk)"/>
  ` : `
  <circle cx="${C}" cy="${C}" r="${OUTER}" fill="url(#gold)" filter="url(#sh)"/>
  <circle cx="${C}" cy="${C}" r="${OUTER}" fill="url(#bevel)"/>
  <circle cx="${C}" cy="${C}" r="${BAND}" fill="url(#band)"/>
  <g fill="url(#gold)">${beads}</g>
  <circle cx="${C}" cy="${C}" r="${RING}" fill="url(#gold)"/>
  <circle cx="${C}" cy="${C}" r="${RING - 10}" fill="url(#disk)"/>
  <g clip-path="url(#diskClip)">
    <circle cx="512" cy="492" r="200" fill="#4a86f0" opacity=".45" filter="url(#glow)"/>
  </g>
  <circle cx="${C}" cy="${C}" r="${RING - 18}" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".55"/>
  `}

  <g filter="url(#shT)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#goldInk)" mask="url(#callig)"/>
  </g>
</svg>`;
</script>
</body></html>
